<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人知识花园</title>
    <meta name="description" content="把 Notion 里的公开笔记整理成个人知识花园。" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/config.js"></script>
    <script defer src="assets/app.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <div class="hero-copy">
          <span class="eyebrow">Notion Knowledge Garden</span>
          <h1>个人知识花园</h1>
          <p>把 Notion 里的公开笔记整理成个人知识花园。</p>
          <div class="hero-actions">
            <button class="button secondary" type="button" id="writerButton">写笔记</button>
            <button class="button primary" type="button" id="refreshButton">刷新笔记</button>
            <a class="button ghost" href="#notes">浏览全部</a>
          </div>
        </div>
        <div class="hero-visual" aria-label="知识花园横幅">
          <div class="garden-card large">
            <span>Capture</span>
            <strong>灵感采集</strong>
          </div>
          <div class="garden-card">
            <span>Connect</span>
            <strong>主题连接</strong>
          </div>
          <div class="garden-card">
            <span>Review</span>
            <strong>持续生长</strong>
          </div>
        </div>
      </section>

      <section class="stats" aria-label="知识库概览">
        <article class="stat-card">
          <span>总笔记数</span>
          <strong id="totalNotes">-</strong>
        </article>
        <article class="stat-card">
          <span>分类数</span>
          <strong id="totalCategories">-</strong>
        </article>
        <article class="stat-card">
          <span>标签数</span>
          <strong id="totalTags">-</strong>
        </article>
        <article class="stat-card">
          <span>最近更新</span>
          <strong id="lastUpdated">-</strong>
        </article>
      </section>

      <section class="toolbar" aria-label="筛选工具">
        <label class="search-box">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="标题、摘要、标签" autocomplete="off" />
        </label>
        <label>
          <span>分类</span>
          <select id="categoryFilter">
            <option value="all">全部分类</option>
          </select>
        </label>
        <label>
          <span>标签</span>
          <select id="tagFilter">
            <option value="all">全部标签</option>
          </select>
        </label>
        <label>
          <span>排序</span>
          <select id="sortSelect">
            <option value="updated">最近更新</option>
            <option value="created">创建时间</option>
            <option value="title">标题</option>
          </select>
        </label>
      </section>

      <div class="status-line" id="statusLine">正在读取知识花园...</div>

      <section class="notes-grid" id="notes" aria-live="polite"></section>
    </main>

    <aside class="writer" id="writerPanel" aria-hidden="true">
      <div class="writer-backdrop" data-close-writer></div>
      <article class="writer-card" role="dialog" aria-modal="true" aria-labelledby="writerTitle">
        <button class="icon-button close-button" type="button" aria-label="关闭" data-close-writer>×</button>
        <div class="writer-body">
          <div class="detail-meta">
            <span>同步到 Notion</span>
            <span>新建笔记</span>
          </div>
          <h2 id="writerTitle">写一篇新笔记</h2>
          <form id="writerForm" class="writer-form">
            <label class="full">
              <span>管理密码</span>
              <input id="writerToken" name="token" type="password" autocomplete="current-password" required />
            </label>
            <label>
              <span>标题</span>
              <input id="writerNoteTitle" name="title" type="text" required />
            </label>
            <label>
              <span>Slug</span>
              <input id="writerSlug" name="slug" type="text" placeholder="my-note-slug" />
            </label>
            <label class="full">
              <span>摘要</span>
              <textarea id="writerSummary" name="summary" rows="3"></textarea>
            </label>
            <label>
              <span>分类</span>
              <input id="writerCategory" name="category" type="text" placeholder="随笔" />
            </label>
            <label>
              <span>标签</span>
              <input id="writerTags" name="tags" type="text" placeholder="记录, 灵感" />
            </label>
            <label class="full">
              <span>正文</span>
              <textarea id="writerContent" name="content" rows="12" placeholder="支持 Markdown：# 标题、- 列表、> 引用、```代码```"></textarea>
            </label>
            <div class="writer-options full">
              <label>
                <input id="writerPublished" name="published" type="checkbox" checked />
                <span>公开到网站</span>
              </label>
              <label>
                <input id="writerPinned" name="pinned" type="checkbox" />
                <span>置顶</span>
              </label>
            </div>
            <div class="writer-actions full">
              <button class="button primary" type="submit">发布到 Notion</button>
              <button class="button ghost" type="button" data-close-writer>取消</button>
            </div>
            <p class="writer-status full" id="writerStatus"></p>
          </form>
        </div>
      </article>
    </aside>

    <aside class="detail" id="detailPanel" aria-hidden="true">
      <div class="detail-backdrop" data-close-detail></div>
      <article class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <button class="icon-button close-button" type="button" aria-label="关闭" data-close-detail>×</button>
        <img class="detail-cover" id="detailCover" alt="" hidden />
        <div class="detail-body">
          <div class="detail-meta">
            <span id="detailCategory"></span>
            <span id="detailUpdated"></span>
          </div>
          <h2 id="detailTitle"></h2>
          <p id="detailSummary"></p>
          <div class="tag-row" id="detailTags"></div>
          <div class="article-content" id="detailContent"></div>
        </div>
      </article>
    </aside>

    <template id="noteCardTemplate">
      <article class="note-card">
        <button class="note-open" type="button">
          <img class="note-cover" alt="" hidden />
          <div class="note-content">
            <div class="note-topline">
              <span class="note-category"></span>
              <span class="note-date"></span>
            </div>
            <h3></h3>
            <p></p>
            <div class="tag-row"></div>
          </div>
        </button>
      </article>
    </template>
  </body>
</html>
